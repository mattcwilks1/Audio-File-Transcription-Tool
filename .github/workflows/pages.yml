name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on via the API if it isn't already,
      # so the site can go live without changing repository settings by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish only what the tool needs — keeps .git and docs out of the upload.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src vendor _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
